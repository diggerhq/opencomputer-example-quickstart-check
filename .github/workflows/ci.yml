name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run doctor
      # The demonstration base deliberately contains stale instructions.
      # Any PR changing the guide must make the real released quickstart pass.
      - name: Verify corrected quickstart
        if: github.event_name == 'pull_request'
        run: npm run verify:quickstart
